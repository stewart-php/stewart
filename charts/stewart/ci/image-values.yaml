code:
  mode: image
  image:
    repository: ghcr.io/example/home
    tag: v1.0.0
homeAssistant:
  url: ws://homeassistant.local:8123/api/websocket
  existingSecret: stewart-home-assistant
config:
  apps:
    hello:
      options:
        watch: sun.sun
workers: 2
revisionHistoryLimit: 1
adminApi:
  enabled: true
  host: 0.0.0.0
metrics:
  enabled: true
  podMonitor:
    enabled: true
    interval: 30s
    labels:
      release: kube-prometheus-stack
networkPolicy:
  enabled: true
  metrics:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
