{{- $name := include "stewart.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $controlToken := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "control-token") -}}
{{- $controlToken = index $existing.data "control-token" -}}
{{- else -}}
{{- $controlToken = randAlphaNum 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "stewart.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.control.existingSecret }}
  control-token: {{ $controlToken }}
  {{- end }}
  {{- if and .Values.homeAssistant.token (not .Values.homeAssistant.existingSecret) }}
  home-assistant-token: {{ .Values.homeAssistant.token | b64enc }}
  {{- end }}
  {{- if and .Values.persistence.url (not .Values.persistence.existingSecret) }}
  persistence-url: {{ .Values.persistence.url | b64enc }}
  {{- end }}
