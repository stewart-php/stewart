{{- $mode := .Values.code.mode -}}
{{- if not (has $mode (list "image" "git" "volume")) }}
{{- fail (printf "code.mode is %q; expected image, git or volume" $mode) }}
{{- end }}
{{- $homeAssistantToken := include "stewart.homeAssistantTokenSource" . -}}
{{- $persistenceUrl := include "stewart.persistenceUrlSource" . -}}
{{- $controlToken := include "stewart.controlTokenSource" . -}}
{{- $adminToken := include "stewart.adminTokenSource" . -}}
{{- if not $homeAssistantToken }}
{{- fail "set homeAssistant.existingSecret, or homeAssistant.token" }}
{{- end }}
{{- $readOnlyRoot := and .Values.securityContext.readOnlyRootFilesystem (not (and (eq $mode "image") .Values.code.generateOnStart)) -}}
{{- $containerSecurity := set (deepCopy .Values.securityContext) "readOnlyRootFilesystem" $readOnlyRoot -}}
{{- $waitForValkey := and .Values.valkey.enabled (not $persistenceUrl) -}}
{{- $secretFiles := dict "control-token" $controlToken "admin-token" $adminToken "home-assistant-token" $homeAssistantToken "persistence-url" $persistenceUrl -}}
{{- if eq $mode "git" }}
{{- with .Values.code.git.tokenSecret }}{{ if .name }}{{ $_ := set $secretFiles "git-token" (printf "%s/%s" .name .key) }}{{ end }}{{ end }}
{{- with .Values.code.git.sshKeySecret }}{{ if .name }}{{ $_ := set $secretFiles "git-ssh-key" (printf "%s/%s" .name .key) }}{{ end }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stewart.fullname" . }}
  labels:
    {{- include "stewart.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
spec:
  # Two daemons would both run every automation, so there is exactly one, and never two during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stewart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: daemon
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: stewart
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stewart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: daemon
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Service links would add STEWART_*_SERVICE_HOST variables for every Service named stewart-something.
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if $waitForValkey }}
      initContainers:
        # The daemon stops when the store is unreachable at start; on a first install Valkey may still be starting.
        - name: wait-for-valkey
          image: {{ include "stewart.codeImage" . }}
          imagePullPolicy: {{ include "stewart.codePullPolicy" . }}
          command:
            - php
            - -r
            - 'while (!@fsockopen(getenv("VALKEY_HOST"), 6379, $code, $message, 2)) { fwrite(STDERR, "waiting for valkey\n"); sleep(2); }'
          env:
            - name: VALKEY_HOST
              value: {{ include "stewart.valkeyName" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: stewart
          image: {{ include "stewart.codeImage" . }}
          imagePullPolicy: {{ include "stewart.codePullPolicy" . }}
          args:
            - run
            {{- if .Values.config }}
            - --config=/etc/stewart/stewart.yaml
            {{- end }}
          env:
            {{- if eq $mode "git" }}
            - name: STEWART_BOOT_GIT_URL
              value: {{ required "code.git.url is required when code.mode is git" .Values.code.git.url | quote }}
            - name: STEWART_BOOT_GIT_REF
              value: {{ .Values.code.git.ref | quote }}
            {{- if .Values.code.git.tokenSecret.name }}
            - name: STEWART_BOOT_GIT_TOKEN_FILE
              value: /run/secrets/stewart/git-token
            {{- end }}
            {{- if .Values.code.git.sshKeySecret.name }}
            - name: STEWART_BOOT_GIT_SSH_KEY_FILE
              value: /run/secrets/stewart/git-ssh-key
            {{- end }}
            {{- end }}
            - name: STEWART_BOOT_COMPOSER
              value: {{ ternary "never" "auto" (eq $mode "image") }}
            - name: STEWART_BOOT_GENERATE
              value: {{ ternary "1" "0" .Values.code.generateOnStart | quote }}
            {{- include "stewart.env" (dict "root" . "homeAssistantToken" $homeAssistantToken "persistenceUrl" $persistenceUrl "controlToken" $controlToken) | nindent 12 }}
            {{- if eq .Values.probes.mode "http" }}
            - name: STEWART_HTTP__LISTEN
              value: {{ printf (ternary "tcp://[%s]:%d" "tcp://%s:%d" (contains ":" .Values.probes.host)) .Values.probes.host (int .Values.probes.port) | quote }}
            {{- end }}
            {{- if .Values.adminApi.enabled }}
            - name: STEWART_HTTP__ADMIN__LISTEN
              value: {{ printf (ternary "tcp://[%s]:%d" "tcp://%s:%d" (contains ":" .Values.adminApi.host)) .Values.adminApi.host (int .Values.adminApi.port) | quote }}
            - name: STEWART_HTTP__ADMIN__TOKEN_FILE
              value: /run/secrets/stewart/admin-token
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or (eq .Values.probes.mode "http") .Values.adminApi.enabled }}
          ports:
            {{- if eq .Values.probes.mode "http" }}
            - name: probe
              containerPort: {{ .Values.probes.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.adminApi.enabled }}
            - name: admin
              containerPort: {{ .Values.adminApi.port }}
              protocol: TCP
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml $containerSecurity | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- include "stewart.probe" (dict "root" . "kind" "liveness" "settings" .Values.probes.startup) | nindent 12 }}
          livenessProbe:
            {{- include "stewart.probe" (dict "root" . "kind" "liveness" "settings" .Values.probes.liveness) | nindent 12 }}
          readinessProbe:
            {{- include "stewart.probe" (dict "root" . "kind" "readiness" "settings" .Values.probes.readiness) | nindent 12 }}
          volumeMounts:
            {{- if eq $mode "image" }}
            - name: var
              mountPath: /app/var
            {{- else }}
            - name: app
              mountPath: /app
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/stewart
              readOnly: true
            {{- if .Values.config }}
            - name: config
              mountPath: /etc/stewart
              readOnly: true
            {{- end }}
      volumes:
        {{- if eq $mode "image" }}
        - name: var
          emptyDir: {}
        {{- else if eq $mode "git" }}
        - name: app
          emptyDir: {}
        {{- else }}
        - name: app
          persistentVolumeClaim:
            claimName: {{ required "code.volume.claimName is required when code.mode is volume" .Values.code.volume.claimName }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              {{- include "stewart.secretSources" $secretFiles | nindent 14 }}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "stewart.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
