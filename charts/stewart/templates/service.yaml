{{- $admin := include "stewart.adminReachable" . -}}
{{- $metrics := include "stewart.metricsReachable" . -}}
{{- if or $admin $metrics }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stewart.fullname" . }}
  labels:
    {{- include "stewart.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
spec:
  type: ClusterIP
  ports:
    {{- if $admin }}
    - name: admin
      port: {{ .Values.adminApi.port }}
      targetPort: admin
    {{- end }}
    {{- if $metrics }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
  selector:
    {{- include "stewart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
{{- end }}
