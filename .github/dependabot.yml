version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/skeleton']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /.docker/php
    schedule:
      interval: weekly

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
