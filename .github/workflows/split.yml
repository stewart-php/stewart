# Mirrors every package, the skeleton and the Home Assistant integration into its read-only repository under
# stewart-php, on main and on every tag.
# Needs a GitHub App installed on those repositories (vars.SPLIT_APP_CLIENT_ID, secrets.SPLIT_APP_PRIVATE_KEY).
name: Split

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: split-${{ github.ref }}

jobs:
  split:
    name: ${{ matrix.repository }}
    if: vars.SPLIT_APP_CLIENT_ID != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { directory: packages/client, repository: client }
          - { directory: packages/codegen, repository: codegen }
          - { directory: packages/contracts, repository: contracts }
          - { directory: packages/mqtt, repository: mqtt }
          - { directory: packages/runtime, repository: runtime }
          - { directory: packages/store, repository: store }
          - { directory: packages/store-redis, repository: store-redis }
          - { directory: packages/sun, repository: sun }
          - { directory: packages/support, repository: support }
          - { directory: packages/testing, repository: testing }
          - { directory: skeleton, repository: skeleton }
          - { directory: integrations/home-assistant, repository: hass-stewart }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SPLIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: stewart-php
          repositories: ${{ matrix.repository }}
      - uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          # The action writes this before the @ of the clone URL; an app token only works there as user:password.
          GITHUB_TOKEN: x-access-token:${{ steps.token.outputs.token }}
        with:
          package_directory: ${{ matrix.directory }}
          repository_organization: stewart-php
          repository_name: ${{ matrix.repository }}
          branch: main
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          user_name: stewart-split[bot]
          user_email: stewart-split[bot]@users.noreply.github.com

  # HACS installs from hass-stewart's releases, so a tag gets a release there with the zip hacs.json names.
  hacs:
    needs: split
    if: vars.SPLIT_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SPLIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: stewart-php
          repositories: hass-stewart
      - name: Publish the HACS release
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd integrations/home-assistant/custom_components/stewart && zip -qr "$RUNNER_TEMP/stewart.zip" .)
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/stewart.zip" --repo stewart-php/hass-stewart \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
      - name: Validate for HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          repository: stewart-php/hass-stewart
          # Not in the HACS brands repository yet; issues live in this repository.
          ignore: brands issues
          comment: false
          github_token: ${{ steps.token.outputs.token }}

  packagist:
    needs: split
    if: vars.PACKAGIST_USERNAME != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Ask Packagist to read the new versions
        run: |
          for repository in client codegen contracts mqtt runtime store store-redis sun support testing skeleton; do
            curl -fsS -X POST -H 'Content-Type: application/json' \
              "https://packagist.org/api/update-package?username=$USERNAME&apiToken=$TOKEN" \
              -d "{\"repository\":{\"url\":\"https://github.com/stewart-php/$repository\"}}"
            echo
          done
        env:
          USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
