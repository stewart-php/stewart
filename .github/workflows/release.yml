# A tag vX.Y.Z publishes everything that shares the version: the runtime images, the Helm chart and a GitHub release.
# The split workflow pushes the same tag to every package repository, and Packagist picks it up from there.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI passed on the tagged commit
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" = 0 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA. Push main, wait for CI, then re-run this release."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - id: version
        name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
          } >> "$GITHUB_OUTPUT"
      - name: The skeleton requires this release line
        run: |
          grep -q "\"stewart-php/runtime\": \"^$MINOR\"" skeleton/composer.json
          grep -q "ghcr.io/stewart-php/runtime:$MAJOR\$" skeleton/Dockerfile
          grep -q "ghcr.io/stewart-php/runtime:$MAJOR\$" skeleton/compose.yaml
          grep -q "ghcr.io/stewart-php/runtime:$MAJOR-dev\$" skeleton/compose.dev.yaml
          grep -q "ghcr.io/stewart-php/runtime:$MAJOR\$" skeleton/deploy/compose.git.yaml
        env:
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
      - name: The Home Assistant integration carries the version
        run: |
          grep -q "\"version\": \"$VERSION\"" integrations/home-assistant/custom_components/stewart/manifest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: The changelog has the release
        run: grep -q "^## \[$VERSION\]" CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: The release has its notes
        run: test -s "docs/releases/$VERSION.md"
        env:
          VERSION: ${{ steps.version.outputs.version }}

  distribution:
    needs: verify
    uses: ./.github/workflows/distribution.yml

  image:
    needs: [verify, distribution]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/runtime-image.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ needs.verify.outputs.version }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  chart:
    needs: [verify, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package and push the chart
        id: push
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm package charts/stewart --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/stewart-$VERSION.tgz" oci://ghcr.io/stewart-php/charts 2>&1 | tee push.log
          echo "digest=$(sed -n 's/^Digest: //p' push.log)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
      - name: Sign
        run: |
          echo "$TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
          cosign sign --yes "ghcr.io/stewart-php/charts/stewart@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}

  github-release:
    needs: [verify, image, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the release notes
        run: |
          {
            cat "docs/releases/$VERSION.md"
            printf '\n---\n\nEvery change is in the [changelog](https://stewart-php.github.io/docs-dev/changelog/).\n'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
