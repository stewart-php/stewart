# A tag vX.Y.Z publishes everything that shares the version: the runtime images, the Helm chart and a GitHub release.
# The split workflow pushes the same tag to every package repository, and Packagist picks it up from there.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - name: The skeleton requires this release line
        run: |
          grep -q "\"stewart-php/runtime\": \"^$MINOR\"" skeleton/composer.json
          grep -q "ghcr.io/stewart-php/runtime:$MINOR\$" skeleton/Dockerfile
          grep -q "ghcr.io/stewart-php/runtime:$MINOR\$" skeleton/compose.yaml
          grep -q "ghcr.io/stewart-php/runtime:$MINOR-dev\$" skeleton/compose.dev.yaml
        env:
          MINOR: ${{ steps.version.outputs.minor }}
      - name: The Home Assistant integration carries the version
        run: |
          grep -q "\"version\": \"$VERSION\"" integrations/home-assistant/custom_components/stewart/manifest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: The changelog has the release
        run: grep -q "^## \[$VERSION\]" CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}

  image:
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/runtime-image.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ needs.verify.outputs.version }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  chart:
    needs: [verify, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package and push the chart
        id: push
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm package charts/stewart --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/stewart-$VERSION.tgz" oci://ghcr.io/stewart-php/charts 2>&1 | tee push.log
          echo "digest=$(sed -n 's/^Digest: //p' push.log)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
      - name: Sign
        run: |
          echo "$TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
          cosign sign --yes "ghcr.io/stewart-php/charts/stewart@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}

  github-release:
    needs: [verify, image, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the changelog section
        run: |
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
