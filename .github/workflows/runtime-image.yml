# Builds ghcr.io/stewart-php/runtime and its -dev variant for amd64 and arm64 on native runners, then tags, signs
# and scans the multi-arch images. Called by the release and the weekly rebuild.
name: Runtime image

on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to build
        type: string
        required: true
      version:
        description: The Stewart version, such as 0.1.3
        type: string
        required: true
      rolling-only:
        description: Push only the rolling tags (0.1, or 1 and 1.2), leaving the exact version tag as it was
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/stewart-php/runtime

jobs:
  build:
    name: ${{ matrix.target }} ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        target: [runtime, runtime-dev]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          pull: true
          provenance: mode=max
          sbom: true
          labels: org.opencontainers.image.version=${{ inputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Tag and sign ${{ matrix.target }}
    needs: build
    strategy:
      matrix:
        target: [runtime, runtime-dev]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Tag the multi-arch image
        id: tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          suffix=""
          if [ "$TARGET" = runtime-dev ]; then suffix=-dev; fi
          major="${VERSION%%.*}"
          minor="${VERSION%.*}"
          tags="$minor$suffix"
          if [ "$major" -ge 1 ]; then tags="$tags $major$suffix"; fi
          if [ "$ROLLING_ONLY" != true ]; then tags="$tags $VERSION$suffix"; fi

          arguments=""
          for tag in $tags; do arguments="$arguments -t $IMAGE:$tag"; done
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $arguments $(printf "$IMAGE@sha256:%s " *)

          first_tag="${tags%% *}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
          ROLLING_ONLY: ${{ inputs.rolling-only }}
      - name: Sign
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.tag.outputs.digest }}
      - name: Scan
        if: matrix.target == 'runtime'
        run: >
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.75.0
          image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.tag.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
