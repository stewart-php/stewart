name: Home Assistant e2e

on:
  push:
    branches: [main]
    paths: &paths
      - 'integrations/home-assistant/**'
      - 'packages/client/**'
      - 'packages/contracts/**'
      - 'packages/runtime/**'
      - 'skeleton/**'
      - '.docker/ha/**'
      - '.docker/ha-e2e/**'
      - '.docker/php/**'
      - 'bin/link-packages.sh'
      - 'bin/test-ha-e2e.sh'
      - 'Makefile'
      - '.github/workflows/ha-e2e.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Real Home Assistant, ${{ matrix.ha }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ha: [min, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          tags: stewart-php:dev
          load: true
          cache-from: type=gha,scope=dev-8.5
      - name: Build the Home Assistant toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/ha/Dockerfile
          build-args: HA=${{ matrix.ha }}
          tags: stewart-ha:${{ matrix.ha }}
          load: true
          cache-from: type=gha,scope=ha-${{ matrix.ha }}
      - run: make test-ha-e2e HA=${{ matrix.ha }}
