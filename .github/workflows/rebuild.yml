# Rebuilds the runtime image of the latest release every week, and of the previous major's latest release until its
# support ends, so the rolling tags (2 and 2.0, 1 and 1.8) pick up PHP and Alpine security fixes. Exact version tags
# stay as released.
name: Rebuild runtime image

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-24.04
    outputs:
      releases: ${{ steps.latest.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: latest
        name: Find the latest release, and the previous major's while it is supported
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)
          if [ -z "$latest" ]; then echo 'No release to rebuild.' >&2; exit 1; fi
          releases="{\"tag\":\"$latest\",\"version\":\"${latest#v}\"}"
          previous=$(git tag --list "v$PREVIOUS_MAJOR.*.*" --sort=-version:refname | head -n 1)
          if [ -n "$previous" ] && [ "$previous" != "$latest" ] && [ "$(date -u +%F)" \< "$PREVIOUS_MAJOR_UNTIL" ]; then
            releases="$releases,{\"tag\":\"$previous\",\"version\":\"${previous#v}\"}"
          fi
          echo "releases=[$releases]" >> "$GITHUB_OUTPUT"
        env:
          PREVIOUS_MAJOR: '1'
          PREVIOUS_MAJOR_UNTIL: '2027-05-01'

  image:
    needs: latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.latest.outputs.releases) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/runtime-image.yml
    with:
      ref: ${{ matrix.release.tag }}
      version: ${{ matrix.release.version }}
      rolling-only: true
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
