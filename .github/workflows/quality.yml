name: Quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage and mutation testing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          tags: stewart-php:dev
          load: true
          cache-from: type=gha,scope=dev-8.5
      - run: make install
      - run: make coverage
      - name: Summarize coverage
        run: |
          {
            echo '### Coverage'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' var/reports/coverage/summary.txt | sed '/^\s*$/d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mutation testing of the changed lines
        if: github.event_name == 'pull_request'
        run: make infection
        env:
          INFECTION_BASE: origin/${{ github.base_ref }}
      - name: Summarize mutation testing
        if: ${{ !cancelled() && hashFiles('var/reports/infection/summary.txt') != '' }}
        run: |
          {
            echo '### Mutation testing'
            echo '```'
            cat var/reports/infection/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: var/reports
          retention-days: 14

  metrics:
    name: Metrics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          tags: stewart-php:dev
          load: true
          cache-from: type=gha,scope=dev-8.5
      - run: make install
      - run: make metrics
        env:
          METRICS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics
          path: var/reports/metrics
          retention-days: 14

  # Breaks are reported, not enforced, while the packages are 0.x.
  bc-check:
    name: Backwards compatibility
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          tags: stewart-php:dev
          load: true
          cache-from: type=gha,scope=dev-8.5
      - run: make install
      - run: make bc-check

  # A full run takes about 40 minutes on a hosted runner, so it runs weekly.
  mutation:
    name: Full mutation testing
    needs: coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          tags: stewart-php:dev
          load: true
          cache-from: type=gha,scope=dev-8.5
      - run: make install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: var/reports
      - run: make infection
        env:
          GITHUB_ACTIONS: ''
      - name: Summarize mutation testing
        run: |
          {
            echo '### Mutation testing'
            echo '```'
            cat var/reports/infection/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation
          path: var/reports/infection
          retention-days: 35

  summary:
    name: Summary
    needs: [coverage, metrics, mutation]
    if: ${{ !cancelled() && needs.coverage.result == 'success' && needs.metrics.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          tags: stewart-php:dev
          load: true
          cache-from: type=gha,scope=dev-8.5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: var/reports
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metrics
          path: var/reports/metrics
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.mutation.result == 'success'
        with:
          name: mutation
          path: var/reports/mutation
      - name: Reuse the latest weekly mutation report
        if: needs.mutation.result != 'success' && github.event_name != 'pull_request'
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality.yml --event schedule --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name mutation --dir var/reports/mutation || echo "No mutation report in run $run_id."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fetch the main branch numbers
        if: github.event_name == 'pull_request'
        run: curl -fsSL "https://${OWNER}.github.io/${REPOSITORY}/reports/summary.json" -o var/reports/baseline.json || rm -f var/reports/baseline.json
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
      - run: make quality-summary QUALITY_BASELINE=var/reports/baseline.json
      - run: cat var/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/reports
          cp .github/pages/index.html site/
          cp var/reports/summary.json var/reports/summary.md var/reports/badge-*.json site/reports/
          cp -R var/reports/coverage/html site/reports/coverage
          cp -R var/reports/metrics/html site/reports/metrics
          if [ -d var/reports/mutation ]; then cp -R var/reports/mutation site/reports/mutation; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    name: Publish reports
    needs: summary
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Pull requests audit the lock in CI; this catches advisories published since the last change.
  audit:
    name: Dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          tags: stewart-php:dev
          load: true
          cache-from: type=gha,scope=dev-8.5
      - run: make audit
