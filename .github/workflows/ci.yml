name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Diagnose Docker Hub pulls
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "--- daemon.json"; sudo cat /etc/docker/daemon.json
          echo "--- client config"; jq '{auths: (.auths // {} | keys), credsStore, credHelpers}' ~/.docker/config.json || true
          scope='service=registry.docker.io&scope=repository:ratelimitpreview/test:pull'
          probe() { curl -s --head -H "Authorization: Bearer $1" https://registry-1.docker.io/v2/ratelimitpreview/test/manifests/latest | grep -iE '^HTTP/|ratelimit'; }
          echo "--- Docker Hub, anonymous"; probe "$(curl -s "https://auth.docker.io/token?$scope" | jq -r .token)"
          echo "--- Docker Hub, as $DOCKERHUB_USERNAME"; probe "$(curl -s --user "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" "https://auth.docker.io/token?$scope" | jq -r .token)"
          echo "--- mirror.gcr.io manifest"
          curl -s -o /dev/null -w '%{http_code}\n' -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' https://mirror.gcr.io/v2/library/eclipse-mosquitto/manifests/2
          sudo jq '. + {"debug": true}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new > /dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo kill -HUP "$(pidof dockerd)"
          sleep 2
          since=$(date '+%Y-%m-%d %H:%M:%S')
          echo "--- docker pull mirror.gcr.io/library/eclipse-mosquitto:2"; docker pull mirror.gcr.io/library/eclipse-mosquitto:2 || true
          echo "--- docker pull eclipse-mosquitto:2"; docker pull eclipse-mosquitto:2 || true
          echo "--- dockerd log"; sudo journalctl -u docker --since "$since" --no-pager | grep -iE 'mirror|endpoint|pull|auth|toomany|error' | tail -60
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          tags: stewart-php:dev
          load: true
          cache-from: type=gha,scope=dev-8.5
          cache-to: type=gha,mode=max,scope=dev-8.5
      - name: Build the Home Assistant toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/ha/Dockerfile
          build-args: HA=latest
          tags: stewart-ha:latest
          load: true
          cache-from: type=gha,scope=ha-latest
          cache-to: type=gha,mode=max,scope=ha-latest
      - run: make install
      - run: make audit
      - run: make check
      - name: Annotate test failures
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: var/reports/junit/*.xml
          annotate_only: true
          transformers: '[{"searchValue":"^/app/","replaceValue":""}]'

  lint-ci:
    name: Workflows and Dockerfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docker
        with:
          buildx: "false"
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          echo "::add-matcher::.github/matchers/actionlint.json"
          echo "::add-matcher::.github/matchers/hadolint.json"
      - run: make lint-ci
        env:
          GH_TOKEN: ${{ github.token }}

  # Runs on every change: docs link to repository files, so a code rename can break them.
  docs:
    name: Documentation sites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docker
        with:
          buildx: "false"
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: make docs-install
      - run: make docs-build

  # make check covers the latest Home Assistant; this job adds the oldest supported one.
  home-assistant:
    name: Home Assistant integration, minimum version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the Home Assistant toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/ha/Dockerfile
          build-args: HA=min
          tags: stewart-ha:min
          load: true
          cache-from: type=gha,scope=ha-min
          cache-to: type=gha,mode=max,scope=ha-min
      - run: make ha-check HA=min
      - run: make ha-hassfest

  packages:
    name: Packages alone${{ matrix.lowest && ', lowest' || '' }}
    strategy:
      fail-fast: false
      matrix:
        lowest: ['', '1']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          tags: stewart-php:dev
          load: true
          cache-from: type=gha,scope=dev-8.5
      - run: make install
      - run: make test-packages LOWEST=${{ matrix.lowest }}
