name: Set up Docker
description: Pull Docker Hub images anonymously through mirror.gcr.io and set up Buildx with the same mirror.

inputs:
  buildx:
    description: Set up a Buildx builder that uses the mirror too.
    default: "true"

runs:
  using: composite
  steps:
    - name: Pull Docker Hub images through mirror.gcr.io
      shell: bash
      run: |
        config=/etc/docker/daemon.json
        { sudo cat "$config" 2>/dev/null || echo '{}'; } \
          | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' \
          | sudo tee "$config.new" > /dev/null
        sudo mv "$config.new" "$config"
        sudo systemctl restart docker
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      if: inputs.buildx == 'true'
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
