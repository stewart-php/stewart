name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: make install
      - name: Static analysis
        run: make stan
      - name: Tests
        run: make test
      - name: Settings from .env.example, with a placeholder token
        run: sed 's/^STEWART_HOME_ASSISTANT__TOKEN=$/STEWART_HOME_ASSISTANT__TOKEN=ci/' .env.example > .env
      - name: Configuration and apps
        run: make check
